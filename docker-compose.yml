version: '3.8'

services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - flask-app
    networks:
      - app-network

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      # WARNING: Hardcoded password for local demo purposes ONLY.
      MONGO_INITDB_ROOT_PASSWORD: mysecretpassword
    volumes:
      - ./data/mongo:/data/db
    networks:
      - app-network

  redis:
    image: redis:latest
    networks:
      - app-network

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ./data/ollama:/root/.ollama
    networks:
      - app-network

  flask-app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - mongo
      - redis
      - ollama
    environment:
      # WARNING: Hardcoded password for local demo purposes ONLY.
      - MONGO_URI=mongodb://admin:mysecretpassword@mongo:27017/intellidocs?authSource=admin
      - CELERY_BROKER_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
      - FLASK_SECRET_KEY=a-very-long-and-static-secret-key-for-the-demo
    networks:
      - app-network

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A main.celery worker --loglevel=info
    depends_on:
      - redis
      - flask-app
    environment:
      # WARNING: Hardcoded password for local demo purposes ONLY.
      - MONGO_URI=mongodb://admin:mysecretpassword@mongo:27017/intellidocs?authSource=admin
      - CELERY_BROKER_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
