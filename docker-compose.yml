services:
  # The UI service that builds the Angular app and serves it with Nginx
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: ui
    ports:
      - "80:80" # Expose the UI on port 80
    networks:
      - app-network
    depends_on:
      - api # Wait for the API to be ready before starting

  # The Flask API service (renamed to 'api' to match the nginx config)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flask-app
    depends_on:
      - mongo
      - redis
      - ollama
    environment:
      - FLASK_ENV=development
      - MONGO_URI=mongodb://root:example@mongo:27017/intellidocs?authSource=admin
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OLLAMA_HOST=http://ollama:11434
    networks:
      - app-network

  # The Celery worker for background tasks
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A main.celery worker --loglevel=info
    container_name: celery-worker
    depends_on:
      - redis
      - ollama
    environment:
      - MONGO_URI=mongodb://root:example@mongo:27017/intellidocs?authSource=admin
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OLLAMA_HOST=http://ollama:11434
    networks:
      - app-network

  # Other services remain the same
  mongo:
    image: mongo
    container_name: mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=example
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  redis:
    image: redis/redis-stack-server:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-network

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11435:11434" # Use host port 11435 to avoid conflict
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
  ollama-data:
