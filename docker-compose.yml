services:
  # Redis Service (for Celery)
  redis:
    image: redis:7.0-alpine
    container_name: redis_broker
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama AI Model Server
  ollama:
    image: ollama/ollama
    container_name: ollama_server
    ports: # Exposes port 11434 inside the container to port 11435 on the host machine.
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment the following lines if you have an NVIDIA GPU
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Base service that builds the common image for api and worker
  base-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: intellidocs-base-app:latest

  # Main Flask Application (API)
  api:
    image: intellidocs-base-app:latest
    container_name: flask_api
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    env_file:
      - .env # Pass environment variables from a .env file
    extra_hosts:
      - "host.docker.internal:host-gateway" # Allows container to connect to host's localhost
    environment:
      - FLASK_ENV=production
      # Point to the Docker network hostnames for dependencies
      - MONGO_URI=mongodb://host.docker.internal:27017/intellidocs
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
    # The command to run the production server (Gunicorn)
    command: gunicorn --workers 3 --bind 0.0.0.0:8000 "main:app"

  # Celery Worker Service
  worker:
    image: intellidocs-base-app:latest
    container_name: celery_worker
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway" # Allows container to connect to host's localhost
    environment:
      - MONGO_URI=mongodb://host.docker.internal:27017/intellidocs
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
    # The command to start the Celery worker
    command: celery -A main.celery worker --loglevel=info

  # Angular Frontend Service
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: angular_ui
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  redis_data:
  ollama_data:
