<div class="category-manager-container">
  <div class="header">
    <h1>Categories</h1>
    <button class="btn-add" (click)="openDialog()">Create New Category</button>
  </div>
  <ag-grid-angular
    style="width: 100%; height: 500px;"
    class="ag-theme-alpine-dark"
    [rowData]="rowData"
    [columnDefs]="columnDefs"
    (gridReady)="onGridReady($event)"
  >
  </ag-grid-angular>
</div>
