
<h1 mat-dialog-title>{{ data.playbook ? 'Edit' : 'Create' }} Playbook</h1>

<div mat-dialog-content class="dialog-content">
  <form [formGroup]="playbookForm">
    <!-- Playbook Name and Category -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Playbook Name</mat-label>
      <input matInput formControlName="name" required>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Category Name</mat-label>
      <input matInput formControlName="category_name" required>
    </mat-form-field>

    <mat-divider></mat-divider>

    <!-- Add New Step Section -->
    <div class="add-step-section">
      <mat-form-field appearance="outline">
        <mat-label>Select Step Type</mat-label>
        <mat-select #stepTypeSelect>
          <mat-option *ngFor="let stepType of availableStepTypes" [value]="stepType">
            {{ stepConfig[stepType].name }}
          </mat-option>
        </mat-select>
      </mat-form-field>
      <button mat-raised-button color="primary" (click)="addStep(stepTypeSelect.value)">Add Step</button>
    </div>

    <h3 *ngIf="steps.controls.length > 0">Steps</h3>

    <!-- Steps Array -->
    <mat-accordion formArrayName="steps" class="steps-accordion">
      <mat-expansion-panel *ngFor="let step of steps.controls; let i=index" [formGroupName]="i" class="step-panel">
        <mat-expansion-panel-header>
          <mat-panel-title>
            Step {{i + 1}}: {{ stepConfig[step.get('type')!.value].name || 'Unknown Step' }} - {{ step.get('name')!.value }}
          </mat-panel-title>
        </mat-expansion-panel-header>

        <!-- Common Step Fields -->
        <div class="step-form-fields">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Step Name</mat-label>
            <input matInput formControlName="name" required>
          </mat-form-field>

          <!-- Dynamic Fields Based on Step Type -->
          <ng-container [ngSwitch]="step.get('type')!.value">
            <ng-container *ngFor="let field of stepConfig[step.get('type')!.value].fields">
              <mat-form-field appearance="outline" class="full-width" *ngIf="field.type === 'text'">
                <mat-label>{{ field.label }}</mat-label>
                <input matInput [formControlName]="field.name">
              </mat-form-field>
              <mat-form-field appearance="outline" class="full-width" *ngIf="field.type === 'textarea'">
                <mat-label>{{ field.label }}</mat-label>
                <textarea matInput [formControlName]="field.name" cdkTextareaAutosize cdkAutosizeMinRows="3"></textarea>
              </mat-form-field>
            </ng-container>
          </ng-container>
        </div>

        <button mat-stroked-button color="warn" (click)="removeStep(i)">Remove Step</button>

      </mat-expansion-panel>
    </mat-accordion>
  </form>
</div>

<div mat-dialog-actions align="end">
  <button mat-button (click)="onNoClick()">Cancel</button>
  <button mat-raised-button color="primary" (click)="onSave()" [disabled]="!playbookForm.valid">Save</button>
</div>
