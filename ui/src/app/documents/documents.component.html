<div class="page-container">
  <div class="page-header">
    <h1>Document Library</h1>
    <button mat-flat-button color="primary" (click)="openUploadDialog()">
      <mat-icon>upload_file</mat-icon>
      Upload Document
    </button>
  </div>

  <div class="filter-bar">
    <mat-form-field appearance="outline">
      <mat-label>Filter by Category</mat-label>
      <mat-select (selectionChange)="onCategoryFilterChange($event.value)">
        <mat-option value="All">All Categories</mat-option>
        <mat-option *ngFor="let category of categories$ | async" [value]="category.name">
          {{ category.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div class="table-container mat-elevation-z2">
    <div class="loading-shade" *ngIf="isLoading$ | async">
      <mat-spinner></mat-spinner>
    </div>

    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

      <!-- Filename Column -->
      <ng-container matColumnDef="filename">
        <th mat-header-cell *matHeaderCellDef> Filename </th>
        <td mat-cell *matCellDef="let doc"> {{doc.filename}} </td>
      </ng-container>

      <!-- Category Column -->
      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef> Category </th>
        <td mat-cell *matCellDef="let doc">
          <span class="category-chip" [ngClass]="doc.category | lowercase">{{doc.category}}</span>
        </td>
      </ng-container>

      <!-- Status Column -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef> Status </th>
        <td mat-cell *matCellDef="let doc">
          <span class="status-chip" [ngClass]="doc.status | lowercase">{{doc.status}}</span>
        </td>
      </ng-container>

      <!-- Created At Column -->
      <ng-container matColumnDef="created_at">
        <th mat-header-cell *matHeaderCellDef> Uploaded On </th>
        <td mat-cell *matCellDef="let doc"> {{doc.created_at | date:'medium'}} </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let doc">
          <button mat-icon-button color="primary" (click)="viewDocument(doc._id)" matTooltip="View Details">
            <mat-icon>visibility</mat-icon>
          </button>
          <button mat-icon-button color="accent" (click)="reprocessDocument(doc._id)" matTooltip="Re-process Document">
            <mat-icon>replay</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteDocument(doc._id)" matTooltip="Move to Trash">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[10, 25, 100]" showFirstLastButtons>
    </mat-paginator>
  </div>
</div>
