<div class="dashboard-container" *ngIf="stats">
  <h1>Dashboard</h1>

  <div class="stats-cards">
    <div class="card">
      <h2>Total Documents</h2>
      <p>{{ stats.total_documents }}</p>
    </div>
    <div class="card">
      <h2>Pending Users</h2>
      <p>{{ stats.pending_users }}</p>
    </div>
  </div>

  <div class="charts-container">
    <div class="chart">
      <h2>Documents by Status</h2>
      <ngx-charts-pie-chart
        [results]="objectToChartData(stats.status_counts)"
        [labels]="true"
        [doughnut]="true">
      </ngx-charts-pie-chart>
    </div>
    <div class="chart">
      <h2>Documents by Category</h2>
      <ngx-charts-bar-vertical
        [results]="stats.category_counts"
        [xAxis]="true"
        [yAxis]="true"
        [legend]="true">
      </ngx-charts-bar-vertical>
    </div>
  </div>

  <div class="recent-documents">
    <h2>Recent Documents</h2>
    <ag-grid-angular
      style="width: 100%; height: 300px;"
      class="ag-theme-alpine"
      [rowData]="documents"
      [columnDefs]="columnDefs">
    </ag-grid-angular>
  </div>
</div>
