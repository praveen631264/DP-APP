
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # This is the corrected location block. It specifically targets the /api/v1/ prefix
    # that your Flask application uses.
    location /api/v1/ {
        # The proxy_pass directive points to your backend service.
        # Importantly, there is NO trailing slash here. This ensures that the full
        # request path (e.g., /api/v1/documents) is passed to the Flask app.
        proxy_pass http://flask-app:8080;

        # These headers are standard best practice for proxying.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # This location block handles the real-time updates via Socket.IO.
    location /socket.io {
        proxy_pass http://flask-app:8080/socket.io;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

