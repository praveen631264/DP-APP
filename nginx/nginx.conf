server {
    listen 80;
    server_name localhost;

    # The root directory where the Angular app's static files are served from.
    root /usr/share/nginx/html;

    # The main entry point for the application.
    index index.html;

    # For any request that doesn't match a static file, serve index.html.
    # This allows the client-side router to handle the URL.
    location / {
        try_files $uri /index.html;
    }

    # Proxy API requests to the backend Flask container.
    location /api/v1/ {
        # Pass the request directly to the Flask app without altering the path.
        proxy_pass http://flask-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket connections for real-time updates.
    location /socket.io {
        proxy_pass http://flask-app:8080/socket.io;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}