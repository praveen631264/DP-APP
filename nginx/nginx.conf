
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # All requests for static assets and Angular routes are handled here.
    location / {
        try_files $uri /index.html;
    }

    # This is the corrected API proxy.
    # It captures all requests to /api/ and rewrites them to /api/v1/ for the backend.
    location ~ ^/api/(.*)$ {
        # Add headers to disable caching for all API responses.
        expires -1;
        add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';

        # Rewrite the URL to add the /v1 prefix, then proxy to the Flask app.
        proxy_pass http://flask-app:8080/api/v1/$1$is_args$args;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # This location block handles the real-time updates via Socket.IO.
    location /socket.io {
        proxy_pass http://flask-app:8080/socket.io;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
