server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # This rule ensures that Angular routing works correctly.
    location / {
        try_files $uri /index.html;
    }

    # A placeholder for the API. We will fix this next.
    location /api/ {
        # This will currently return a 404, but it will prevent the server from crashing.
        return 404;
    }
}
